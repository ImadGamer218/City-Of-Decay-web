<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>City Of Decay</title>
    <style>
        body {
            font-family: Arial;
            background-color: #0f172a;
            color: white;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>City Of Decay</h1>
    <p>¡Juega ahora a mi juego en Roblox!</p>

    <button onclick="abrirJuego()">🎮 Visitar juego</button>

    <script>
        function abrirJuego() {
            var gameID = "ID_DEL_JUEGO"; // ← CAMBIA ESTO

            // Intenta abrir la app de Roblox
            window.location.href = "roblox://placeId=" + gameID;

            // Si no funciona, abre la web después
            setTimeout(function() {
                window.location.href = "https://www.roblox.com/games/" + gameID;
            }, 2000);
        }
    </script>

</body>
</html>
